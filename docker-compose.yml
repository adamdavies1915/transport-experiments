services:
  scraper:
    build: .
    restart: unless-stopped
    environment:
      - SSE_URL=${SSE_URL:-https://nolatransit.fly.dev/sse}
      - UPLOAD_INTERVAL=${UPLOAD_INTERVAL:-60000}
      - RECONNECT_DELAY=${RECONNECT_DELAY:-5000}
      - MOTHER_DUCK_API_KEY=${MOTHER_DUCK_API_KEY}
      - MOTHERDUCK_DATABASE=${MOTHERDUCK_DATABASE:-my_db}
